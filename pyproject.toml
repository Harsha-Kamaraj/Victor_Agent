[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victor-agent"
version = "0.1.0"
description = "Voice-driven computer-use agent for Windows and macOS that reads the accessibility tree instead of guessing pixels."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Harsha K" }]
keywords = ["agent", "voice", "computer-use", "uiautomation", "accessibility", "windows", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
]

[project.optional-dependencies]
# P1 - voice I/O.
# webrtcvad is deliberately absent: it imports pkg_resources and so fails on
# setuptools 81+. Victor ships its own energy VAD instead; install webrtcvad
# yourself to opt into the WebRtcVad backend.
voice = [
    "sounddevice>=0.5",
    "numpy>=2.1",
    "piper-tts>=1.3",
]

# P4/P5 - screen perception and desktop actuation.
# One backend per platform behind victor.desktop.Backend: UI Automation on
# Windows, the Accessibility API on macOS. Both read the same tree shape.
desktop = [
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "mss>=10.0",
    "pillow>=11.0",
]
# P6/P7 - memory and scout
memory = [
    "faiss-cpu>=1.9",
    "fastembed>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
victor = "victor.cli:main"

[project.urls]
Repository = "https://github.com/Gagan-1718/Victor_Agent"

[tool.hatch.build.targets.wheel]
packages = ["src/victor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import from src/ directly rather than via the installed package, so the
# suite runs even when an editable install is stale or broken.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
